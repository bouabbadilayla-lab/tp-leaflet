

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte Leaflet - Béni Mellal</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #176b55;
      color: white;
      text-align: center;
      padding: 15px;
    }

    #map {
      height: 85vh;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h2>Carte interactive de Béni Mellal</h2>
    <p>TP de cartographie avec Leaflet</p>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Centrer la carte sur Béni Mellal
    const beniMellal = [32.3373, -6.3498];

    const map = L.map('map').setView(beniMellal, 12);

    // Ajouter le fond de carte OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Ajouter un marqueur sur la ville
    L.marker(beniMellal)
      .addTo(map)
      .bindPopup('<b>Béni Mellal</b><br>Maroc')
      .openPopup();

    // Dessiner un cercle rouge de 2 km de rayon
    L.circle(beniMellal, {
      color: 'red',
      fillColor: '#ff3333',
      fillOpacity: 0.2,
      radius: 2000,
      weight: 3
    }).addTo(map)
      .bindPopup('Zone circulaire autour de Béni Mellal : rayon de 2 km');

  </script>
</body>
</html>

  </script>
</body>
</html>
