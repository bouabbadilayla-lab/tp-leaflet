
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon TP Leaflet - Maroc</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background: #176b55;
      color: white;
      padding: 16px;
      text-align: center;
    }

    #map {
      height: 85vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h2>Ma carte interactive du Maroc</h2>
    <p>TP : découverte de Leaflet</p>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Centrer la carte sur le Maroc
    const map = L.map('map').setView([31.7917, -7.0926], 5);

    // Ajouter le fond de carte OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Ajouter un marqueur à Marrakech
    L.marker([31.6295, -7.9811])
      .addTo(map)
      .bindPopup('<b>Marrakech</b><br>Maroc')
      .openPopup();

    // Ajouter un cercle
    L.circle([31.6295, -7.9811], {
      radius: 10000,
      color: 'red',
      fillOpacity: 0.2
    }).addTo(map).bindPopup('Zone autour de Marrakech');

    // Ajouter un polygone
    L.polygon([
      [31.65, -8.05],
      [31.60, -7.90],
      [31.55, -8.02]
    ], {
      color: 'green'
    }).addTo(map).bindPopup('Polygone de démonstration');

    // Afficher les coordonnées lors d'un clic
    map.on('click', function(e) {
      L.popup()
        .setLatLng(e.latlng)
        .setContent(
          'Coordonnées : ' +
          e.latlng.lat.toFixed(5) + ', ' +
          e.latlng.lng.toFixed(5)
        )
        .openOn(map);
    });
  </script>
</body>
</html>
